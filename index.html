<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>David | Portfolio</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UT+Boldonse+Demo:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alatsi:wght@400&display=swap" />

    <style>
        :root {
            --cube-size: clamp(250px, 35vw, 450px);
            --accent-color: #7ac2c8;
            --glass-bg: rgba(122, 194, 200, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow-x: hidden;
            overflow-y: auto; 
            font-family: 'UT Boldonse Demo', sans-serif;
            color: #fff;
        }

        .cube-background {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: var(--cube-size);
            height: var(--cube-size);
            perspective: 1500px;
            z-index: 1;
            pointer-events: none; 
            transition: opacity 0.1s ease-out; 
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: var(--cube-size);
            height: var(--cube-size);
            background: var(--glass-bg);
            border: 1px solid rgba(122, 194, 200, 0.2);
            backdrop-filter: blur(8px);
        }

        .front  { transform: rotateY(0deg) translateZ(calc(var(--cube-size) / 2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }

        .hero {
            position: relative;
            height: 101vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .hi-im-david {
            font-size: clamp(80px, 15vw, 200px);
            line-height: 1.4;
            color: var(--accent-color);
            text-transform: uppercase;
            margin: 0;
            padding: 0 20px;
            user-select: none;
        }

        .social-icons {
            margin-top: 30px;
            display: flex;
            gap: 30px;
            align-items: center; /* Ensures icons stay centered together */
            pointer-events: auto;
        }

        .social-icons img {
            width: clamp(40px, 6vw, 70px);
            cursor: pointer;
            transition: transform 0.3s;
        }

        /* Specific fix to make Figma logo smaller */
        .figma-icon {
            width: clamp(30px, 4.5vw, 52px) !important;
        }

        .social-icons img:hover { transform: scale(1.2); }

        .skills-container {
            width: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            padding: 70px 0;
            margin-top: 120px;
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 4;
        }

        .skills-scroller {
            display: flex;
            gap: 150px;
            white-space: nowrap;
            animation: scroll 12s linear infinite;
        }

        .skill-item {
            font-size: clamp(30px, 6vw, 70px);
        }

        @keyframes scroll {
            0% { transform: translateX(90%); }
            100% { transform: translateX(-290%); }
        }

        .future-content {
            background: #000;
            padding: 100px 20px;
            text-align: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <div class="cube-background" id="cubeContainer">
        <div class="cube" id="interactiveCube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <div class="content-wrapper">
        <section class="hero">
            <h1 class="hi-im-david">Hi I’m<br>David</h1>
            <div class="social-icons">
                <img id="github" src="./Frame 7.svg" alt="GitHub">
                <img id="maker-world" src="./maker-world.svg" alt="MakerWorld">
                <img id="figma" class="figma-icon" src="./Frame 6.svg" alt="Figma">
            </div>
        </section>

        <div class="skills-container">
            <div class="skills-scroller">
                <div class="skill-item">Coding 🧑‍💻</div>
                <div class="skill-item">Web design 📊</div>
                <div class="skill-item" style="margin-top: -50px;"><span style="font-weight: 900; font-size: 110px;">3</span>D printing 🧱</div>
                <div class="skill-item">Problem solving 🧩</div>
                <div class="skill-item" style="margin-top: -40px;"><span style="font-weight: 900; font-size: 110px;">3</span>D Modelling 💻</div>
            </div>
        </div>

        <section class="future-content">
            <h2 style="font-size: 50px; color: #7ac2c8;">My Projects</h2>
            <p style="font-size: 24px; max-width: 600px; opacity: 0.7; line-height: 1.6; margin: 0 auto;">
                
            </p>
        </section>
    </div>

<script>
    const cube = document.getElementById('interactiveCube');
    const cubeContainer = document.getElementById('cubeContainer');
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;
    let isHovering = false;
    let idleX = 0, idleY = 0;

    const smoothness = 0.05; 

    function update() {
        if (!isHovering) {
            idleX += 0.3;
            idleY += 0.4;
            targetX = idleX;
            targetY = idleY;
        }
        currentX += (targetX - currentX) * smoothness;
        currentY += (targetY - currentY) * smoothness;
        cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        requestAnimationFrame(update);
    }
    update();

    window.addEventListener('scroll', () => {
        const scrollPosition = window.scrollY;
        const fadeEnd = 600; 
        let opacity = 1 - (scrollPosition / fadeEnd);
        if (opacity < 0) opacity = 0;
        if (opacity > 1) opacity = 1;
        cubeContainer.style.opacity = opacity;
    });

    window.addEventListener('mousemove', (e) => {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distance = Math.hypot(e.clientX - centerX, e.clientY - centerY);

        if (distance < 500) {
            isHovering = true;
            targetX = -(e.clientY - centerY) * 0.2;
            targetY = (e.clientX - centerX) * 0.2;
        } else if (isHovering) {
            isHovering = false;
            idleX = currentX;
            idleY = currentY;
        }
    });

    const links = {
        "github": "https://github.com/davdadev",
        "maker-world": "https://makerworld.com/en/@user_2466880989",
        "figma": "https://figma.com/@davidsebbag"
    };

    Object.keys(links).forEach(id => {
        const el = document.getElementById(id);
        if(el) el.onclick = () => window.open(links[id], "_blank");
    });
</script>

</body>
</html>
