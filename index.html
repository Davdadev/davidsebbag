<script>
// Keep .david-sebbag exactly 1px to the right of .wiggle-logo
(function(){
	const logo = document.querySelector('.wiggle-logo');
	const title = document.querySelector('.david-sebbag');
	if (!logo || !title) return;

	// ensure title is positioned absolutely so we can place it by coordinates
	title.style.position = 'absolute';

	function place() {
		const r = logo.getBoundingClientRect();
		const docLeft = window.scrollX || window.pageXOffset;
		const docTop = window.scrollY || window.pageYOffset;

		// place title 1px to the right of logo, align top with logo (no vertical offset)
		const left = Math.round(r.right + docLeft + 1);
		const top  = Math.round(r.top + docTop - 9);

		title.style.left = left + 'px';
		title.style.top  = top + 'px';
	}

	// initial placement
	place();

	// update on scroll and resize
	window.addEventListener('scroll', place, { passive: true });
	window.addEventListener('resize', place);

	// if logo size changes, reposition using ResizeObserver (modern browsers)
	if (window.ResizeObserver) {
		const ro = new ResizeObserver(place);
		ro.observe(logo);
		ro.observe(title);
	}
})();


const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ12334567890!@#$%^&*";

let interval = null;

// cache the element and its original text so we can restore it after the animation
const maintxtEl = document.querySelector(".maintxt");
const originalMaintxt = maintxtEl ? maintxtEl.innerText : "findingf loopholes";

if (maintxtEl) {
	// prevent re-entering the animation while it's already running
	let isAnimating = false;
	let isHovered = false;
	let isFinished = false; // becomes true when the animation completes

	maintxtEl.addEventListener("mouseenter", event => {  
		isHovered = true;
		if (isAnimating) return;
		isAnimating = true;
		isFinished = false;

		let iteration = 0;
    
		clearInterval(interval);
    
		interval = setInterval(() => {
			event.target.innerText = event.target.innerText
				.split("")
				.map((letter, index) => {
					if(index < iteration) {
						return event.target.dataset.value[index];
					}
					return letters[Math.floor(Math.random() * letters.length)];
				})
				.join("");
      
			if(iteration >= event.target.dataset.value.length){ 
				clearInterval(interval);
				// mark animation finished but DO NOT restore here if hovered
				isFinished = true;
				isAnimating = false;
			}
			iteration += 1 / 3;
		}, 25);
	});

	maintxtEl.addEventListener("mouseleave", event => {
		isHovered = false;
		// only restore when the animation has finished
		if (isFinished && event.target.innerText !== originalMaintxt) {
			event.target.innerText = originalMaintxt;
			isFinished = false;
		}
	});
}
</script>
